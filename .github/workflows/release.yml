# Draft only: not run and not added to the user's repository.
name: HGhub Windows build and scan
"on":
  workflow_dispatch:
  push:
    branches: [codex/windows-scan-build-20261112]
permissions:
  contents: read

jobs:
  source_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c2182dd51c81f57ceebae5159129db62a48a578d
          persist-credentials: false
      - name: Install and update ClamAV
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          mkdir -p "$RUNNER_TEMP/clamdb"
          freshclam --config-file=/etc/clamav/freshclam.conf --datadir="$RUNNER_TEMP/clamdb" --log="$RUNNER_TEMP/freshclam.log" --stdout
      - name: Scan checked out source
        shell: bash
        run: |
          set -euo pipefail
          clamscan --database="$RUNNER_TEMP/clamdb" --recursive --infected --no-summary --exclude-dir='(^|/)\.git(/|$)' .
          echo 'ClamAV source scan completed without a detection.'

  windows:
    needs: source_scan
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c2182dd51c81f57ceebae5159129db62a48a578d
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer and executable
        run: pnpm tauri build --bundles nsis
      - name: Collect outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path windows-output | Out-Null
          Copy-Item 'src-tauri/target/release/huangguo-client.exe' 'windows-output/HGhub.exe'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw "Expected one installer; found $($installers.Count)" }
          Copy-Item $installers[0].FullName 'windows-output/'
          Get-FileHash 'windows-output/*.exe' -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unscanned-intermediate
          path: windows-output/*.exe
          retention-days: 7
          if-no-files-found: error

  artifact_scan:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-unscanned-intermediate
          path: windows-output
      - name: Install and update ClamAV
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          mkdir -p "$RUNNER_TEMP/clamdb"
          freshclam --config-file=/etc/clamav/freshclam.conf --datadir="$RUNNER_TEMP/clamdb" --log="$RUNNER_TEMP/freshclam.log" --stdout
      - name: Scan Windows executables
        shell: bash
        run: |
          set -euo pipefail
          test "$(find windows-output -type f -name '*.exe' | wc -l)" -eq 2
          clamscan --database="$RUNNER_TEMP/clamdb" --recursive --infected --no-summary windows-output
          sha256sum windows-output/*.exe > windows-output/SHA256SUMS.txt
          echo 'ClamAV executable scan completed without a detection.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-scanned
          path: windows-output/*
          retention-days: 7
          if-no-files-found: error

